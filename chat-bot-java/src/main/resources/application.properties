server.port=8080

# 允许跨域（前端开发服务器）
spring.websocket.allowed-origins=*

# ASR 测试用例存储目录
bench.cases.dir=./asr-test-cases

stepfun.api.key=
stepfun.asr.url=wss://api.stepfun.com/v1/realtime/asr/stream
stepfun.tts.url=wss://api.stepfun.com/v1/realtime/audio?model=step-tts-mini
stepfun.tts.voice=livelybreezy-female
stepfun.llm.url=https://api.stepfun.com/v1/chat/completions
stepfun.llm.model=step-3.5-flash-2603
# Sierra Headless API
sierra.api.token=
sierra.api.key=
sierra.api.url=https://eu.api.sierra.chat/chat
sierra.api.compatibility-date=2025-02-01
# FANO ASR
fano.asr.url=https://agent-aws-poc-hase.fano.ai/speech/recognize
fano.asr.token=
# 阿里云百炼 ASR
aliyun.asr.url=wss://dashscope.aliyuncs.com/api-ws/v1/inference
aliyun.asr.api-key=

# ==============================
# 火山引擎 BigASR（豆包流式语音识别）
# 使用双向流式优化版接口，性能优于标准双向流式版本
# 控制台获取凭证：https://console.volcengine.com/speech/new/setting/apikeys
# ==============================

# WebSocket 接口地址
# bigmodel_async = 双向流式优化版（推荐，只在结果变化时才推送，性能更优）
# bigmodel       = 标准双向流式版
# bigmodel_nostream = 流式输入模式（准确率最高但延迟大，适合离线场景）
volc.asr.url=wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async

# 新版控制台：只需要 App Key（X-Api-Key）
# 若使用旧版控制台，需同时填写 app-key（AppID）和 access-key（Access Token）
volc.asr.app-key=
volc.asr.access-key=

# 资源 ID，决定计费方式
# volc.bigasr.sauc.duration  = 豆包ASR 1.0 小时版
# volc.bigasr.sauc.concurrent = 豆包ASR 1.0 并发版
# volc.seedasr.sauc.duration  = 豆包ASR 2.0 小时版
# volc.seedasr.sauc.concurrent = 豆包ASR 2.0 并发版
volc.asr.resource-id=volc.bigasr.sauc.duration

# ------------------------------
# 音频参数
# ------------------------------
# 音频容器格式，支持 pcm / wav / ogg / mp3（pcm/wav 内部必须是 pcm_s16le）
volc.asr.audio.format=pcm
# 音频采样率（Hz），目前只支持 16000
volc.asr.audio.rate=16000
# 采样精度（bit），目前只支持 16
volc.asr.audio.bits=16
# 声道数：1=单声道，2=立体声，默认1
volc.asr.audio.channel=1

# ------------------------------
# 识别行为参数
# ------------------------------
# 模型名称，目前固定为 bigmodel，不要修改
volc.asr.request.model-name=bigmodel

# 数字规范化（ITN）：true=将"一九七零年"转为"1970年"，默认 true
volc.asr.request.enable-itn=true

# 自动加标点，默认 true
volc.asr.request.enable-punc=true

# 语义顺滑：true=自动删除"啊""嗯"等语气词，使文本更流畅，默认 false
volc.asr.request.enable-ddc=true

# 结果返回方式：full=全量文本（每次返回完整句子），single=增量（只返回新增部分）
volc.asr.request.result-type=full

# ------------------------------
# 双向流式优化版（bigmodel_async）专有参数
# ------------------------------
# 二遍识别：true=流式快速上屏 + nostream 高准确率最终结果，默认建议开启
# 开启后，definite=true 的分句才是最终高精度结果
volc.asr.request.enable-nonstream=true

# VAD 强制判停时间（ms），静音超过此时长时强制切句并输出 definite=true
# 最小 200，默认 800；越小越实时但可能误切，越大停顿容忍度越高
volc.asr.request.end-window-size=500

# 强制语音最小时长（ms），音频短于此时长不做判停，防止说话太短被误切
# 推荐 1000，设置后可能轻微影响识别准确率
volc.asr.request.force-to-speech-time=1000

# ------------------------------
# 输出格式参数
# ------------------------------
# 繁体输出：traditional=大陆繁体，tw=台湾正体，hk=香港繁体，留空=简体（默认）
volc.asr.request.output-zh-variant=

# 语种检测：true=在识别结果的 additions 中返回 lid_lang 字段标识语种
# 支持普通话、粤语、闽南语、四川话、陕西话等，需配合 enable-nonstream=true
volc.asr.request.enable-lid=true
